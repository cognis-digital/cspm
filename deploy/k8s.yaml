apiVersion: apps/v1
kind: Deployment
metadata: { name: cspm, labels: { app: cspm } }
spec:
  replicas: 1
  selector: { matchLabels: { app: cspm } }
  template:
    metadata: { labels: { app: cspm } }
    spec:
      containers:
        - name: cspm
          image: ghcr.io/cognis-digital/cspm:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: cspm }
spec:
  selector: { app: cspm }
  ports: [{ port: 80, targetPort: 8000 }]
