[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-cspm"
version = "0.1.1"
description = "Cloud security posture from a config export (public buckets, open SGs, weak IAM)"
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["cognis-digital", "cognis-neural-suite", "secops", "cspm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/cspm"

[project.scripts]
"cspm-emit" = "cspm.connect:emit_main"
cspm = "cspm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cspm"]
